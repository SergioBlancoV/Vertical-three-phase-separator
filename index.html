<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: drafting table — fixed input rail at left, the scaled vertical vessel with its height stack as the hero of the right workspace. */
:root{
  --paper:#EBEEE9; --panel:#F8FAF7; --panel2:#E1E7E0; --ink:#16252A; --ink2:#4C5E63;
  --rule:#C2CAC3; --rule2:#D9E0D8;
  --gas:#5B86A6; --oil:#8A5A14; --water:#2A7A6A;
  --gasF:#C9DCE8; --oilF:#E6D2AC; --waterF:#BFDFD6;
  --ok:#2F6B4F; --warn:#9A7609; --alert:#9C3A20;
  --okBg:#DFEDE4; --warnBg:#F6EDCF; --alertBg:#F6DFD8;
  --steel:#8A9499;
  --disp:"IBM Plex Sans Condensed",-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111A1D; --panel:#192327; --panel2:#223036; --ink:#E6EDE9; --ink2:#9CACAC;
  --rule:#33444A; --rule2:#283840;
  --gas:#86B4D2; --oil:#D9A45A; --water:#54C0A6;
  --gasF:#23414F; --oilF:#4A3A18; --waterF:#1E4A43;
  --ok:#62BD8E; --warn:#D7B343; --alert:#DD7A57;
  --okBg:#1B3429; --warnBg:#352D12; --alertBg:#3A231B;
  --steel:#6E7D84; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111A1D; --panel:#192327; --panel2:#223036; --ink:#E6EDE9; --ink2:#9CACAC;
  --rule:#33444A; --rule2:#283840;
  --gas:#86B4D2; --oil:#D9A45A; --water:#54C0A6;
  --gasF:#23414F; --oilF:#4A3A18; --waterF:#1E4A43;
  --ok:#62BD8E; --warn:#D7B343; --alert:#DD7A57;
  --okBg:#1B3429; --warnBg:#352D12; --alertBg:#3A231B;
  --steel:#6E7D84; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance}
#bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;
  border-bottom:1px solid var(--rule);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
#bar h1{font-size:17px;font-weight:700;letter-spacing:.01em}
#bar .sub{font-size:12px;color:var(--ink2)}
#bar .sp{flex:1}
.byline{display:flex;align-items:baseline;gap:9px;font-size:12.5px;font-weight:500}
.byline a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--rule)}
.byline a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.04em;
  border:0;background:transparent;color:var(--ink2);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button+button{border-left:1px solid var(--rule)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gas);outline-offset:1px}
#wrap{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start}
#wrap.full{grid-template-columns:minmax(0,1fr)}
#rail{border-right:1px solid var(--rule);background:var(--panel);padding-bottom:50px}
#work{padding:0 20px 60px;min-width:0}
fieldset{border:0;margin:0;padding:14px 18px;border-bottom:1px solid var(--rule2)}
legend{font-family:var(--disp);font-size:11.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink2);padding:0 0 8px}
.f{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin-bottom:6px}
.f.u{grid-template-columns:1fr 70px 62px}
.f label{font-size:12.5px;color:var(--ink2);line-height:1.3}
input,select{font-family:var(--mono);font-size:12.5px;width:100%;padding:4px 6px;
  border:1px solid var(--rule);border-radius:2px;background:var(--paper);color:var(--ink)}
select{font-family:var(--body)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--disp);font-size:12px;font-weight:600;padding:5px 10px;border-radius:3px;
  border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
  background:var(--rule2);border:1px solid var(--rule2);border-top:0;margin:0 -20px 20px}
#strip>div{background:var(--panel);padding:12px 16px}
#strip .k{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink2);margin-bottom:3px}
#strip .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.01em}
#strip .n{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
#strip .sour{background:var(--warnBg)}
#strip .sour .v{color:var(--warn)}
section{margin:26px 0 0}
section>h2{font-size:14.5px;font-weight:700;letter-spacing:.02em;margin-bottom:3px}
section>.note{font-size:12.5px;color:var(--ink2);max-width:72ch;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--rule2);border-radius:3px;padding:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hd h3{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.hd .sp{flex:1}
svg{display:block;width:100%;height:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink2);padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:6px 10px 6px 0;border-bottom:1px solid var(--rule2);vertical-align:top}
td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.gov td{background:var(--warnBg)}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:11px;font-family:var(--disp);font-weight:600;letter-spacing:.03em;
  padding:2px 7px;border-radius:2px;background:var(--okBg);color:var(--ok);white-space:nowrap}
.tag.w{background:var(--warnBg);color:var(--warn)}
.tag.a{background:var(--alertBg);color:var(--alert)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:baseline}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center}
ul.msgs{margin:0;padding:0;list-style:none}
ul.msgs li{padding:8px 0 8px 16px;border-top:1px solid var(--rule2);font-size:12.5px;position:relative}
ul.msgs li:first-child{border-top:0}
ul.msgs li::before{content:"";position:absolute;left:0;top:15px;width:8px;height:2px;border-radius:1px;background:var(--ink2)}
ul.msgs li.a::before{background:var(--alert)} ul.msgs li.w::before{background:var(--warn)} ul.msgs li.k::before{background:var(--ok)}
.srcnote{font-size:12px;color:var(--ink2);background:var(--panel);border-left:2px solid var(--warn);
  padding:10px 14px;margin:0 0 14px;max-width:76ch;border-radius:0 3px 3px 0}
pre#rep{font-family:var(--mono);font-size:11.5px;line-height:1.6;white-space:pre-wrap;
  background:var(--panel);border:1px solid var(--rule2);border-radius:3px;padding:14px;max-height:360px;overflow:auto;margin:0}
.btn{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.03em;
  border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 13px;border-radius:3px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--panel)}
footer{border-top:1px solid var(--rule);margin-top:34px;padding:18px 0 0;font-size:12px;color:var(--ink2);max-width:80ch}
footer .au{display:block;margin-top:10px;color:var(--ink)}
footer a{color:var(--ink2)}
@media (max-width:900px){
  #wrap{grid-template-columns:1fr}
  #rail{border-right:0;border-bottom:1px solid var(--rule)}
  .two{grid-template-columns:1fr}
  #work{padding:0 16px 60px}
  #strip{margin:0 -16px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="bar">
  <h1 id="ttl">Separador vertical trifásico</h1>
  <span class="sub" id="sub">Simulador de diseño y selección de materiales</span>
  <span class="sp"></span>
  <span class="byline">Sergio Blanco, PhD
    <a href="https://www.linkedin.com/in/sergio-blanco-professor/" target="_blank" rel="noopener">LinkedIn</a></span>
  <span class="seg" role="group" id="tabs">
    <button id="tab-sim" aria-pressed="true">Simulador</button><button id="tab-ref" aria-pressed="false">Definiciones</button></span>
  <span class="seg" role="group" aria-label="Language">
    <button id="lang-es" aria-pressed="true">ES</button><button id="lang-en" aria-pressed="false">EN</button></span>
</div>
<div id="wrap"><div id="rail"></div><div id="work"><div id="strip"></div><div id="out"></div></div></div>

function derate(ty,T){const a=DERATE[ty];if(T<=a[0][0])return 1;
  for(let i=1;i<a.length;i++){if(T<=a[i][0]){const[x0,y0]=a[i-1],[x1,y1]=a[i];return y0+(y1-y0)*(T-x0)/(x1-x0);}}
  return a[a.length-1][1];}
function fNom(m,T){const k=derate(m.ty,T);
  if(m.ty==="aus")return (m.Rp*k)/1.5;
  return Math.min((m.Rp*k)/1.5,m.Rm/2.4);}

/* ============================================================ physics */
const G=9.81;
function vTerm(dm,rhoL,rhoG,muG){
  let v=Math.sqrt(4*G*dm*(rhoL-rhoG)/(3*0.44*rhoG));
  for(let i=0;i<80;i++){
    const Re=Math.max(rhoG*v*dm/muG,1e-9);
    const Cd=24/Re*(1+0.15*Math.pow(Re,0.687))+0.42/(1+42500*Math.pow(Re,-1.16));
    const vn=Math.sqrt(4*G*dm*(rhoL-rhoG)/(3*Cd*rhoG));
    if(Math.abs(vn-v)<1e-10){v=vn;break;} v=0.5*(v+vn);
  } return v;}
const vStokes=(dm,dRho,mu)=>G*dm*dm*dRho/(18*mu);
function deWaard(Tc,pco2,pH){
  if(pco2<=0)return 0;
  const TK=Tc+273.15;
  let v=Math.pow(10,5.8-1710/TK+0.67*Math.log10(pco2));
  const pHref=3.82+0.00384*Tc+0.5*Math.log10(pco2);
  v*=Math.max(0.05,Math.min(Math.pow(10,0.32*(pHref-pH)),4));
  if(Tc>80)v*=Math.max(0.1,1-(Tc-80)*0.02);
  return v;}

/* ---- SSC regions, ISO 15156-2 Figure 1 ----
   Two parallel boundaries, slope 1 pH unit per decade of pH2S, offset by one
   pH unit, both flattening at 100 kPa. Verified against Table B.2.          */
const SSCLIM={p0:0.3,hi:6.5,lo:5.5,base:3.5,off:1.0,pMax:1000};
const sscUpper=pk=>Math.min(SSCLIM.hi,SSCLIM.base+SSCLIM.off+Math.log10(Math.max(pk,1e-6)));
const sscLower=pk=>Math.min(SSCLIM.lo,Math.max(SSCLIM.base,SSCLIM.base+Math.log10(Math.max(pk,1e-6))));
function sscRegion(pk,pH){
  if(!(pk>0)||pk<SSCLIM.p0)return {r:0,up:null,lo:null,beyond:false};
  const up=sscUpper(pk),lo=sscLower(pk);
  return {r:pH>=up?1:pH>=lo?2:3,up,lo,beyond:pk>SSCLIM.pMax};}
const REGREQ={0:{route:"—",hrc:null,hv:null,smys:null},
 1:{route:"A.2 / A.3 / A.4",hrc:30,hv:300,smys:550},

/* ============================================================ compute */
const conv=(v,u)=>u==="bbld"?v*0.1589873:u==="mmscfd"?v*28316.85:v;
function compute(){
  const R=8.314;
  const qo=conv(S.qo,S.qoU)/86400, qw=conv(S.qw,S.qwU)/86400;
  const qgStd=conv(S.qg,S.qgU)/86400;
  const P=S.pOp*1e5, T=S.tOp+273.15;
  const rhoG=P*(S.mwG/1000)/(S.zG*R*T);
  const qg=qgStd*(101325/P)*(T/288.15)*S.zG;
  const muG=S.muG*1e-3, muO=S.muO*1e-3, muW=S.muW*1e-3;

  /* --- three independent velocity criteria, each giving a minimum diameter --- */
  const vt=vTerm(S.dmG*1e-6,S.rhoO,rhoG,muG);
  const vSB=S.kSB*Math.sqrt(Math.max(S.rhoO-rhoG,1)/rhoG);
  const vGas=Math.min(vt,vSB);
  const Agas=qg/vGas, Dgas=Math.sqrt(4*Agas/Math.PI);
  const vWO=vStokes(S.dmW*1e-6,Math.max(S.rhoW-S.rhoO,1),muO);
  const Awo=qo/vWO, Dwo=Math.sqrt(4*Awo/Math.PI);
  const vOW=vStokes(S.dmO*1e-6,Math.max(S.rhoW-S.rhoO,1),muW);
  const Aow=qw/vOW, Dow=Math.sqrt(4*Aow/Math.PI);
  const Dmin=Math.max(Dgas,Dwo,Dow);
  const govD=Dgas>=Dwo&&Dgas>=Dow?"govGas":(Dwo>=Dow?"govWO":"govOW");
  const D=Math.ceil(Dmin/LIM.dStep.v)*LIM.dStep.v;
  const A=Math.PI/4*D*D;
  const vgReal=qg/A, voUp=qo/A, vwDn=qw/A;

  /* --- height stacked from its causes --- */
  const hw=(qw*S.tW*60)/A, ho=(qo*S.tO*60)/A;
  const hd=Math.max(S.hdMin,D), ht=Math.max(S.htMin,D/2);
  const SEG=[["segH1",S.h1,"w"],["segHw",hw,"w"],["segHo",ho,"o"],
             ["segHf",S.hf,"g"],["segHd",hd,"g"],["segHm",S.hm,"m"],["segHt",ht,"g"]];
  const H=SEG.reduce((a,b)=>a+b[1],0);
  const HD=H/D;

  /* --- chemistry --- */
  const pco2=S.pOp*S.co2/100, ph2s=S.pOp*S.h2s/100, ph2sk=ph2s*100;
  const water=qw>0;
  const SSC=water?sscRegion(ph2sk,S.ph):{r:0,up:null,lo:null,beyond:false};
  const sour=water&&ph2sk>=SSCLIM.p0;
  const vBare=water?deWaard(S.tOp,pco2,S.ph):0;
  let vcor;
  if(!water) vcor=0;
  else if(S.vmode==="man") vcor=S.vcor;
  else if(S.vmode==="mitig"){const Av=Math.min(Math.max(S.avail/100,0),1); vcor=Av*S.vInh+(1-Av)*vBare;}
  else vcor=vBare;
  const loss=vcor*S.life;
  const CA=Math.min(Math.max(loss,1.5),S.caMax);
  const caOver=loss>S.caMax;

  /* --- mechanical, internal pressure only --- */
  const shellMat=!sour?MATS.P265GH:(SSC.r===3?MATS.P265GH:MATS.P355NL2);
  const f=fNom(shellMat,S.tDes), Pm=S.pDes/10;
  const eCalc=(Pm*D*1000)/(2*f*S.zj-Pm);
  const eNom=Math.ceil((eCalc+CA+S.addT)/LIM.caStep.v)*LIM.caStep.v;
  const Rc=S.head==="ell"?0.8*D:1.0*D;
  const eHead=Math.ceil(((Pm*Rc*1000)/(2*f*S.zj-0.5*Pm)+CA+S.addT)/LIM.caStep.v)*LIM.caStep.v;
  const hdep=S.head==="ell"?D/4:D*0.1935;
  const vol=A*H+2*(2/3*Math.PI*Math.pow(D/2,2)*hdep);
  const mass=(Math.PI*(D+eNom/1000)*H*(eNom/1000)+2*1.08*D*D*(eHead/1000))*7850;

  return {qo,qw,qg,rhoG,vt,vSB,vGas,Dgas,Dwo,Dow,Dmin,govD,D,A,vgReal,voUp,vwDn,vWO,vOW,
    Agas,Awo,Aow,hw,ho,hd,ht,SEG,H,HD,hdep,
    pco2,ph2s,ph2sk,SSC,sour,water,vBare,vcor,loss,CA,caOver,
    shellMat,f,eCalc,eNom,eHead,vol,mass};
}

function elevation(c,mode){

  const yTop=mt+hdp, yBot=yTop+c.H*s;      /* tangent lines */
  const xl=cx-Dw/2, xr=cx+Dw/2;

  const esc=x=>String(x).replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]));

  let e=0; const lev={};
  c.SEG.forEach(([k,v])=>{ lev[k]=[e,e+v]; e+=v; });
  const Y=h=>yBot-h*s;
  const yWater=Y(lev.segHw[1]), yOil=Y(lev.segHo[1]);
  const yFeed=Y(lev.segHf[1]), yMeshB=Y(lev.segHm[0]), yMeshT=Y(lev.segHm[1]);

  o.push(`<defs><clipPath id="vz"><path d="M ${xl} ${yTop} A ${Dw/2} ${hdp} 0 0 1 ${xr} ${yTop} L ${xr} ${yBot} A ${Dw/2} ${hdp} 0 0 1 ${xl} ${yBot} Z"/></clipPath>
  <pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0 L6 6 M6 0 L0 6" stroke="var(--ink2)" stroke-width=".7" fill="none"/></pattern>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="var(--ink2)"/></marker>
  <marker id="arL" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M7 0 L0 3 L7 6 z" fill="var(--ink2)"/></marker></defs>`);

  if(mode==="fluid"){
    o.push(`<g clip-path="url(#vz)">
      <rect x="${xl-4}" y="${mt-4}" width="${Dw+8}" height="${yOil-mt+4}" fill="var(--gasF)"/>
      <rect x="${xl-4}" y="${yOil}" width="${Dw+8}" height="${yWater-yOil}" fill="var(--oilF)"/>
      <rect x="${xl-4}" y="${yWater}" width="${Dw+8}" height="${yBot+hdp-yWater+4}" fill="var(--waterF)"/></g>`);
    o.push(`<line x1="${xl}" y1="${yOil}" x2="${xr}" y2="${yOil}" stroke="var(--oil)" stroke-width="1.5"/>`);
    o.push(`<line x1="${xl}" y1="${yWater}" x2="${xr}" y2="${yWater}" stroke="var(--water)" stroke-width="1.5"/>`);
    const lb=(y,txt,col)=>`<text x="${cx}" y="${y}" text-anchor="middle" font-size="11.5" font-family="var(--disp)" font-weight="600" fill="${col}" letter-spacing=".04em">${esc(txt)}</text>`;
    o.push(lb((mt+yOil)/2,LANG==="es"?"GAS":"GAS","var(--gas)"));
    if(yWater-yOil>14) o.push(lb((yOil+yWater)/2+4,LANG==="es"?"ACEITE":"OIL","var(--oil)"));
    if(yBot-yWater>14) o.push(lb((yWater+yBot)/2+4,LANG==="es"?"AGUA":"WATER","var(--water)"));
  }else{
    const Z=screen(c);
    o.push(`<g clip-path="url(#vz)" opacity=".45">
      <rect x="${xl-4}" y="${mt-4}" width="${Dw+8}" height="${yOil-mt+4}" fill="${MATCOL[Z[0].cls]}"/>
      <rect x="${xl-4}" y="${yOil}" width="${Dw+8}" height="${yWater-yOil}" fill="${MATCOL[Z[3].cls]}"/>
      <rect x="${xl-4}" y="${yWater}" width="${Dw+8}" height="${yBot+hdp-yWater+4}" fill="${MATCOL[Z[4].cls]}"/></g>`);
    const lb=(y,txt)=>`<text x="${cx}" y="${y}" text-anchor="middle" font-size="10.5" font-family="var(--mono)" fill="var(--ink)">${esc(txt)}</text>`;
    o.push(lb((mt+yOil)/2,Z[0].mat));
    if(yWater-yOil>14) o.push(lb((yOil+yWater)/2+4,Z[3].mat));
    if(yBot-yWater>14) o.push(lb((yWater+yBot)/2+4,Z[4].mat));
  }

  /* shell outline with both heads */
  o.push(`<path d="M ${xl} ${yTop} A ${Dw/2} ${hdp} 0 0 1 ${xr} ${yTop} L ${xr} ${yBot} A ${Dw/2} ${hdp} 0 0 1 ${xl} ${yBot} Z"
    fill="none" stroke="var(--ink)" stroke-width="2.2"/>`);
  o.push(`<line x1="${xl}" y1="${yTop}" x2="${xr}" y2="${yTop}" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 3"/>`);
  o.push(`<line x1="${xl}" y1="${yBot}" x2="${xr}" y2="${yBot}" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 3"/>`);
  /* skirt */
  o.push(`<line x1="${xl+6}" y1="${yBot}" x2="${xl+6}" y2="${yBot+skirt*s}" stroke="var(--ink)" stroke-width="2"/>
    <line x1="${xr-6}" y1="${yBot}" x2="${xr-6}" y2="${yBot+skirt*s}" stroke="var(--ink)" stroke-width="2"/>
    <line x1="${xl-12}" y1="${yBot+skirt*s}" x2="${xr+12}" y2="${yBot+skirt*s}" stroke="var(--ink)" stroke-width="3"/>
    <text x="${xl-18}" y="${yBot+skirt*s-6}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--ink2)">${LANG==="es"?"faldón":"skirt"}</text>`);
  /* mist extractor */
  o.push(`<rect x="${xl+3}" y="${yMeshT}" width="${Dw-6}" height="${Math.max(yMeshB-yMeshT,4)}" fill="url(#mesh)" stroke="var(--ink)" stroke-width="1.4"/>`);
  /* nozzles */
  o.push(`<rect x="${cx-9}" y="${mt-hdp-18}" width="18" height="${hdp+18}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <rect x="${cx-14}" y="${mt-hdp-22}" width="28" height="5" fill="var(--ink)"/>
    <text x="${cx}" y="${mt-hdp-28}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--gas)">gas</text>`);
  o.push(`<rect x="${xl-30}" y="${yFeed-7}" width="30" height="14" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <rect x="${xl-34}" y="${yFeed-12}" width="5" height="24" fill="var(--ink)"/>
    <path d="M ${xl+5} ${yFeed-16} L ${xl+5} ${yFeed+16} L ${xl+13} ${yFeed+16} L ${xl+13} ${yFeed-16} Z" fill="var(--steel)" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="${xl-38}" y="${yFeed+4}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--ink2)">${LANG==="es"?"entrada":"inlet"}</text>`);
  const yOilN=(yOil+yWater)/2;
  o.push(`<rect x="${xr}" y="${yOilN-6}" width="28" height="12" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <rect x="${xr+27}" y="${yOilN-11}" width="5" height="22" fill="var(--ink)"/>
    <text x="${xr+38}" y="${yOilN+4}" font-size="10" font-family="var(--mono)" fill="var(--oil)">${LANG==="es"?"aceite":"oil"}</text>`);
  o.push(`<rect x="${cx-9}" y="${yBot+hdp}" width="18" height="16" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <rect x="${cx-14}" y="${yBot+hdp+15}" width="28" height="5" fill="var(--ink)"/>
    <text x="${cx+22}" y="${yBot+hdp+16}" font-size="10" font-family="var(--mono)" fill="var(--water)">${LANG==="es"?"agua":"water"}</text>`);

  /* segment stack to the right */
  const xs=xr+132;   /* clear of the side oil nozzle and its label */
  c.SEG.forEach(([k,v])=>{
    const y0=Y(lev[k][0]), y1=Y(lev[k][1]);
    if(y0-y1<1) return;
    o.push(`<line x1="${xs}" y1="${y1}" x2="${xs}" y2="${y0}" stroke="var(--ink2)" stroke-width="1" marker-start="url(#arL)" marker-end="url(#ar)"/>
      <line x1="${xr+4}" y1="${y1}" x2="${xs}" y2="${y1}" stroke="var(--rule)" stroke-width=".7"/>`);
    if(y0-y1>13) o.push(`<text x="${xs+8}" y="${(y0+y1)/2+4}" font-size="10.5" font-family="var(--mono)" fill="var(--ink)">${f1(v)} m</text>
      <text x="${xs+58}" y="${(y0+y1)/2+4}" font-size="10.5" font-family="var(--body)" fill="var(--ink2)">${esc(t(k))}</text>`);
  });
  /* total height on the left, diameter below */
  const xh=xl-62;
  o.push(`<line x1="${xh}" y1="${yTop}" x2="${xh}" y2="${yBot}" stroke="var(--ink2)" stroke-width="1" marker-start="url(#arL)" marker-end="url(#ar)"/>
    <line x1="${xh-6}" y1="${yTop}" x2="${xl}" y2="${yTop}" stroke="var(--rule)" stroke-width=".8"/>
    <line x1="${xh-6}" y1="${yBot}" x2="${xl}" y2="${yBot}" stroke="var(--rule)" stroke-width=".8"/>
    <text x="${xh-8}" y="${(yTop+yBot)/2}" text-anchor="middle" font-size="12" font-family="var(--mono)" font-weight="500" fill="var(--ink)" transform="rotate(-90 ${xh-8} ${(yTop+yBot)/2})">H = ${f1(c.H)} m</text>`);
  const yd=yBot+skirt*s+30;
  o.push(`<line x1="${xl}" y1="${yd}" x2="${xr}" y2="${yd}" stroke="var(--ink2)" stroke-width="1" marker-start="url(#arL)" marker-end="url(#ar)"/>
    <text x="${cx}" y="${yd+17}" text-anchor="middle" font-size="12" font-family="var(--mono)" font-weight="500" fill="var(--ink)">D = ${f1(c.D)} m &#183; H/D = ${f1(c.HD)}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${LANG==="es"?"Dibujo del separador vertical":"Drawing of the vertical separator"}">${o.join("")}</svg>`;
}

function diaBars(c){
  const W=620,H=250,ml=16,mr=16,mt=26,mb=40;
  const rows=[["cGas",c.Dgas,"govGas","var(--gas)"],["cWO",c.Dwo,"govWO","var(--oil)"],["cOW",c.Dow,"govOW","var(--water)"]];
  const dmax=Math.max(c.Dgas,c.Dwo,c.Dow)*1.25;
  const bw=W-ml-mr-150, bh=34, gap=24;
  const o=[];
  rows.forEach(([k,d,g,col],i)=>{
    const y=mt+i*(bh+gap), w=Math.max(d/dmax*bw,2), on=c.govD===g;
    o.push(`<rect x="${ml}" y="${y}" width="${w}" height="${bh}" fill="${col}" opacity="${on?1:.3}" rx="2"/>`);
    const inside=w>78;   /* keep the value off the design-diameter line */
    o.push(`<text x="${inside?ml+w-12:ml+w+10}" y="${y+bh/2+5}" text-anchor="${inside?"end":"start"}" font-size="13" font-family="var(--mono)" font-weight="${on?600:400}" fill="${inside?"var(--paper)":(on?"var(--ink)":"var(--ink2)")}">${f1(d)} m</text>`);
    o.push(`<text x="${ml}" y="${y-7}" font-size="11" font-family="var(--body)" fill="var(--ink2)">${t(k)}</text>`);
    if(on) o.push(`<rect x="${ml-4}" y="${y-2}" width="${w+8}" height="${bh+4}" fill="none" stroke="var(--ink)" stroke-width="1.6" rx="3"/>`);
  });
  const xd=ml+c.D/dmax*bw;
  o.push(`<line x1="${xd}" y1="${mt-14}" x2="${xd}" y2="${H-mb+6}" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="${xd+6}" y="${H-mb+20}" font-size="11" font-family="var(--mono)" font-weight="600" fill="var(--ink)">D = ${f1(c.D)} m</text>`);
  o.push(`<text x="${ml}" y="${H-mb+20}" font-size="10.5" font-family="var(--disp)" font-weight="600" fill="var(--ink2)">${t("diaAx")}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("secDia")}">${o.join("")}</svg>`;
}

const SEGCOL={w:"var(--water)",o:"var(--oil)",g:"var(--gas)",m:"var(--ink2)"};
function heightBar(c){
  const W=620,H=250,ml=16,mr=16,mt=40;
  const bw=W-ml-mr, bh=46;
  let x=ml; const o=[];
  o.push(`<text x="${ml}" y="${mt-14}" font-size="10.5" font-family="var(--disp)" font-weight="600" fill="var(--ink2)">${t("htAx")}</text>`);
  c.SEG.forEach(([k,v,ph])=>{
    const w=v/c.H*bw; if(w<=0.3){x+=w;return;}
    o.push(`<rect x="${x}" y="${mt}" width="${w}" height="${bh}" fill="${SEGCOL[ph]}" opacity=".8"/>`);
    if(w>42) o.push(`<text x="${x+w/2}" y="${mt+bh/2+5}" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="var(--paper)">${f1(v)}</text>`);
    x+=w;
  });
  o.push(`<rect x="${ml}" y="${mt}" width="${bw}" height="${bh}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`);
  o.push(`<text x="${W-mr}" y="${mt-14}" text-anchor="end" font-size="12" font-family="var(--mono)" font-weight="600" fill="var(--ink)">${f1(c.H)} m</text>`);
  /* ranked list beneath */
  const sorted=c.SEG.slice().sort((a,b)=>b[1]-a[1]);
  sorted.forEach(([k,v,ph],i)=>{
    const col=i<4?0:1, row=i%4;
    const xx=ml+col*(bw/2), yy=mt+bh+26+row*21;
    o.push(`<rect x="${xx}" y="${yy-9}" width="10" height="10" fill="${SEGCOL[ph]}" rx="2"/>
      <text x="${xx+16}" y="${yy}" font-size="11.5" font-family="var(--body)" fill="var(--ink2)">${t(k)}</text>
      <text x="${xx+bw/2-18}" y="${yy}" text-anchor="end" font-size="11.5" font-family="var(--mono)" fill="var(--ink)">${f1(v)} m</text>`);
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("secHt")}">${o.join("")}</svg>`;
}

const REGFILL=["var(--okBg)","var(--panel2)","var(--warnBg)","var(--alertBg)"];
const REGINK=["var(--ok)","var(--ink2)","var(--warn)","var(--alert)"];
function regionMap(c,big){
  const W=big?660:560,H=big?400:330,ml=56,mr=20,mt=18,mb=46;
  const x0=0.01,x1=1e4,y0=2.5,y1=7.5;
  const X=p=>ml+(Math.log10(p)-Math.log10(x0))/(Math.log10(x1)-Math.log10(x0))*(W-ml-mr);
  const Y=v=>H-mb-(v-y0)/(y1-y0)*(H-mt-mb);
  const o=[], N=120, xs=[];
  for(let i=0;i<=N;i++) xs.push(SSCLIM.p0*Math.pow(x1/SSCLIM.p0,i/N));
  const up=xs.map(p=>[X(p),Y(Math.min(sscUpper(p),y1))]);
  const lo=xs.map(p=>[X(p),Y(sscLower(p))]);
  const pl=a=>a.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  o.push(`<rect x="${ml}" y="${mt}" width="${X(SSCLIM.p0)-ml}" height="${H-mb-mt}" fill="${REGFILL[0]}"/>`);
  o.push(`<polygon points="${pl(up)} ${X(x1).toFixed(1)},${Y(y1).toFixed(1)} ${X(SSCLIM.p0).toFixed(1)},${Y(y1).toFixed(1)}" fill="${REGFILL[1]}"/>`);
  o.push(`<polygon points="${pl(up)} ${pl(lo.slice().reverse())}" fill="${REGFILL[2]}"/>`);
  o.push(`<polygon points="${pl(lo)} ${X(x1).toFixed(1)},${Y(y0).toFixed(1)} ${X(SSCLIM.p0).toFixed(1)},${Y(y0).toFixed(1)}" fill="${REGFILL[3]}"/>`);
  for(let d=-2;d<=4;d++){const xv=Math.pow(10,d),x=X(xv);
    o.push(`<line x1="${x}" y1="${mt}" x2="${x}" y2="${H-mb}" stroke="var(--rule)" stroke-width=".7" opacity=".55"/>
      <text x="${x}" y="${H-mb+15}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--ink2)">${xv>=1?xv.toLocaleString("en-US"):xv}</text>`);}
  for(let v=3;v<=7;v++){const y=Y(v);
    o.push(`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="var(--rule)" stroke-width=".7" opacity=".55"/>
      <text x="${ml-7}" y="${y+3.5}" text-anchor="end" font-size="9.5" font-family="var(--mono)" fill="var(--ink2)">${v}.0</text>`);}
  o.push(`<polyline points="${pl(up)}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>`);
  o.push(`<polyline points="${pl(lo)}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>`);
  o.push(`<line x1="${X(SSCLIM.p0)}" y1="${mt}" x2="${X(SSCLIM.p0)}" y2="${H-mb}" stroke="var(--ink)" stroke-width="2.4"/>
    <text x="${X(SSCLIM.p0)-5}" y="${mt+12}" text-anchor="end" font-size="9.5" font-family="var(--mono)" fill="var(--ink)">0,3 kPa</text>`);
  o.push(`<line x1="${X(SSCLIM.pMax)}" y1="${mt}" x2="${X(SSCLIM.pMax)}" y2="${H-mb}" stroke="var(--alert)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="${X(SSCLIM.pMax)+5}" y="${mt+12}" font-size="9.5" font-family="var(--mono)" fill="var(--alert)">1 MPa</text>`);
  const lab=(p,v,i)=>`<text x="${X(p)}" y="${Y(v)}" text-anchor="middle" font-size="${big?17:15}" font-family="var(--disp)" font-weight="700" fill="${REGINK[i]}">${i}</text>`;
  o.push(lab(0.045,5.1,0)); o.push(lab(3,6.6,1)); o.push(lab(30,5.5,2)); o.push(lab(900,3.6,3));
  if(c&&c.water&&c.ph2sk>0){
    const px=Math.min(Math.max(c.ph2sk,x0),x1), py=Math.min(Math.max(S.ph,y0),y1);
    o.push(`<line x1="${X(px)}" y1="${mt}" x2="${X(px)}" y2="${H-mb}" stroke="var(--ink)" stroke-width=".8" stroke-dasharray="2 3" opacity=".5"/>
      <line x1="${ml}" y1="${Y(py)}" x2="${W-mr}" y2="${Y(py)}" stroke="var(--ink)" stroke-width=".8" stroke-dasharray="2 3" opacity=".5"/>
      <circle cx="${X(px)}" cy="${Y(py)}" r="6.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.6"/>
      <text x="${X(px)+11}" y="${Y(py)-9}" font-size="10.5" font-family="var(--mono)" font-weight="500" stroke="var(--panel)" stroke-width="3.5" paint-order="stroke" fill="var(--ink)">${f1(c.ph2sk,2)} kPa &#183; pH ${f1(S.ph,1)}</text>`);
  }
  o.push(`<rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mb-mt}" fill="none" stroke="var(--ink2)" stroke-width="1.2"/>
    <text x="${(ml+W-mr)/2}" y="${H-8}" text-anchor="middle" font-size="10.5" font-family="var(--disp)" font-weight="600" fill="var(--ink2)">${t("regAx")}</text>
    <text x="16" y="${(mt+H-mb)/2}" text-anchor="middle" font-size="10.5" font-family="var(--disp)" font-weight="600" fill="var(--ink2)" transform="rotate(-90 16 ${(mt+H-mb)/2})">${t("regAy")}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("regMap")}">${o.join("")}</svg>`;
}

 {t:["El diámetro no se negocia","The diameter does not trade"],

 {t:["Criterio de gas","Gas criterion"],

 {t:["pH in situ","In situ pH"],
  d:["pH del agua en contacto con el acero en las condiciones reales de presión, temperatura y composición, no el medido en superficie. Decide verticalmente en qué región cae el servicio.",

  r:"ISO 15156-2 §7.2.1.2 · Anexo D"},
 {t:["Región 0","Region 0"],
  d:["Por debajo de 0,3 kPa (0,05 psi) de presión parcial de H₂S. Normalmente no se requieren precauciones de selección por SSC. Aun así, los aceros muy susceptibles pueden agrietarse, y por encima de unos 965 MPa de límite elástico hay que atender a composición y procesamiento por riesgo de agrietamiento por hidrógeno incluso sin H₂S.",
     "Below 0.3 kPa (0.05 psi) of H₂S partial pressure. Normally no precautions are required for selection against SSC. Even so, highly susceptible steels can crack, and above roughly 965 MPa yield strength composition and processing deserve attention because of hydrogen stress cracking even without H₂S."],
  r:"ISO 15156-2 §7.2.1.3"},
 {t:["Región 1","Region 1"],
  d:["La menos severa de las tres regiones con H₂S. Admite seleccionar por las rutas A.2, A.3 o A.4. En aceros de línea, resistencias de hasta unos 550 MPa de SMYS y durezas de soldadura de hasta 300 HV han resultado aceptables.",
     "The least severe of the three regions with H₂S. Selection is admitted through routes A.2, A.3 or A.4. For pipeline steels, strengths up to about 550 MPa SMYS and weld hardness up to 300 HV have proven acceptable."],
  r:"ISO 15156-2 §7.2.1.4 · A.4"},
 {t:["Región 2","Region 2"],
  d:["Severidad intermedia. Admite las rutas A.2 o A.3. En aceros de línea, SMYS de hasta unos 450 MPa y durezas de soldadura de hasta 280 HV han resultado aceptables.",

 {t:["Región 3","Region 3"],
  d:["La más severa. Solo admite la ruta A.2, que es la ruta general de la norma: acero al carbono y de baja aleación con dureza máxima de 22 HRC, menos de 1 % en masa de níquel, sin aceros de fácil mecanizado, y en una de las condiciones de tratamiento térmico listadas.",
     "The most severe. Only route A.2 is admitted, which is the standard's general route: carbon and low-alloy steel at 22 HRC maximum hardness, less than 1 % mass fraction nickel, no free-machining steels, and in one of the listed heat-treatment conditions."],
  r:"ISO 15156-2 §7.2.1.4 · A.2.1.2"},
 {t:["Advertencia sobre A.3 y A.4","Caveat on A.3 and A.4"],
  d:["La propia norma advierte que, al momento de su publicación, no existen listados de aceros aprobados para las rutas A.3 ni A.4. Esas dos rutas describen solo propiedades típicas, de modo que en la práctica se termina en A.2 o en calificación por el anexo B.",

 {t:["Dureza de soldadura","Weld hardness"],
  d:["El límite general de la ruta A.2 para la zona de soldadura es 250 HV, o 22 HRC sujeto a las restricciones del método. Los ensayos Vickers se hacen según ISO 6507-1, con los barridos que la norma define para soldadura a tope y en ángulo.",
     "The general limit of route A.2 for the weld zone is 250 HV, or 22 HRC subject to the restrictions of the method. Vickers testing follows ISO 6507-1, using the survey patterns the standard defines for butt and fillet welds."],

]},
{k:"gMech2",items:[
 {t:["SSC — agrietamiento por sulfuros bajo tensión","SSC — sulfide stress cracking"],
  d:["Agrietamiento por la acción combinada de tensión de tracción y corrosión en presencia de agua y H₂S. Es una forma de agrietamiento por hidrógeno: el hidrógeno atómico que genera la corrosión ácida entra al metal y reduce su ductilidad. Los materiales de alta resistencia y las zonas duras de soldadura son los más propensos.",
     "Cracking under the combined action of tensile stress and corrosion in the presence of water and H₂S. It is a form of hydrogen cracking: atomic hydrogen generated by acid corrosion enters the metal and reduces its ductility. High-strength materials and hard weld zones are the most prone."],
  r:"ISO 15156-1 · ISO 15156-2 §7.2.1"},
 {t:["HIC — agrietamiento inducido por hidrógeno","HIC — hydrogen induced cracking"],
  d:["Agrietamiento planar que no necesita tensión externa: el hidrógeno se recombina en trampas internas, típicamente inclusiones alargadas o microestructura bandeada, y las presuriza. Depende de la limpieza inclusionaria del acero, no de la soldadura.",
     "Planar cracking that needs no external stress: hydrogen recombines in internal traps, typically elongated inclusions or banded microstructure, and pressurises them. It depends on the inclusion cleanliness of the steel, not on the welding."],

 {t:["SOHIC — agrietamiento orientado por tensión","SOHIC — stress-oriented HIC"],
  d:["Variante del HIC en la que las grietas se alinean perpendicularmente a la tensión principal y forman escalones. La norma pide considerarlo expresamente en aceros al carbono en forma de chapa y en sus productos soldados, que es el caso de la envolvente de este recipiente.",
     "A variant of HIC in which the cracks align perpendicular to the principal stress and form steps. The standard asks that it be considered expressly for carbon steels in plate form and their welded products, which is the case of this vessel's shell."],
  r:"ISO 15156-2 §7.2.2 · B.4"},
 {t:["SZC — agrietamiento de zona blanda","SZC — soft zone cracking"],
  d:["Agrietamiento en la zona afectada por el calor de la soldadura, asociado a zonas de menor resistencia que concentran deformación. Como el SOHIC, es raro, no está bien entendido y ha causado fallas súbitas.",
     "Cracking in the heat-affected zone of a weld, associated with lower-strength zones that concentrate strain. Like SOHIC it is rare, not well understood, and has caused sudden failures."],
  r:"ISO 15156-2 §7.2.2 · B.4"},
 {t:["SCC por cloruros","Chloride stress corrosion cracking"],
  d:["Agrietamiento de aceros inoxidables en presencia de cloruros y temperatura, favorecido por la evaporación y la concentración local en rendijas. Ocurre sin H₂S y sin oxígeno disuelto, y las soldaduras son las zonas más vulnerables.",
     "Cracking of stainless steels in the presence of chlorides and temperature, favoured by evaporation and local concentration in crevices. It occurs without H₂S and without dissolved oxygen, and welds are the most vulnerable zones."],
  r:"ISO 21457 §6.2.2.6 · §6.6.2"},
 {t:["Corrosión por rendija","Crevice corrosion"],
  d:["Ataque localizado en espacios confinados donde el fluido queda estancado y la química local se acidifica. En un vertical el punto característico es la unión del faldón al fondo inferior, que forma una rendija anular difícil de inspeccionar y de drenar.",
     "Localised attack in confined spaces where the fluid stagnates and the local chemistry acidifies. In a vertical vessel the characteristic location is the skirt-to-bottom-head junction, which forms an annular crevice that is hard to inspect and hard to drain."],
  r:"ISO 8044 · ISO 21457 §8.7"},
 {t:["CUI — corrosión bajo aislamiento","CUI — corrosion under insulation"],
  d:["Corrosión de la superficie externa bajo el aislamiento térmico, por agua retenida y cloruros. En un vertical el agua escurre por toda la altura y se acumula en los anillos de soporte del aislamiento, que son las trampas naturales del conjunto.",
     "Corrosion of the external surface beneath thermal insulation, from retained water and chlorides. In a vertical vessel water runs down the full height and collects at the insulation support rings, which are the natural traps of the assembly."],
  r:"ISO 21457 §6.6.5"},
 {t:["MIC — corrosión microbiológica","MIC — microbiologically influenced corrosion"],
  d:["Corrosión causada por bacterias sésiles en contacto con el acero. Se favorece con velocidades bajas y zonas de depósito; en un vertical, el fondo inferior donde la arena decanta y el agua casi no se mueve.",
     "Corrosion caused by sessile bacteria in contact with the steel. It is favoured by low velocities and settling zones; in a vertical vessel, the bottom head where sand settles and the water barely moves."],
  r:"ISO 21457 §6.2.2.3"},
 {t:["Corrosión bajo depósito","Under-deposit corrosion"],
  d:["Ataque bajo capas de arena o incrustación que aíslan el metal del seno del fluido y del inhibidor. El fondo de un vertical es el colector natural de sólidos, de modo que es donde este mecanismo se concentra.",
     "Attack beneath layers of sand or scale that isolate the metal from the bulk fluid and from the inhibitor. The bottom of a vertical vessel is the natural collector of solids, so it is where this mechanism concentrates."],
  r:"ISO 21457 §6.2.2.2 · §6.5"}
]},
{k:"gProc",items:[
 {t:["Velocidad terminal de la gota","Droplet terminal velocity"],
  d:["Velocidad de caída de una gota en el gas cuando el arrastre iguala al peso. La herramienta la resuelve con un coeficiente de arrastre dependiente del número de Reynolds, y no con Stokes puro, porque a presión alta la gota sale del régimen de Stokes.",
     "Falling velocity of a droplet in the gas when drag equals weight. The tool solves it with a Reynolds-dependent drag coefficient rather than pure Stokes, because at high pressure the droplet leaves the Stokes regime."],

 {t:["Factor K de Souders-Brown","Souders-Brown K factor"],
  d:["Constante empírica que fija la velocidad máxima admisible del gas como K·√((ρL−ρG)/ρG). En un vertical con extractor de niebla el valor habitual es menor que en un horizontal, porque toda la carga de gas atraviesa la malla de frente.",
     "Empirical constant that sets the maximum allowable gas velocity as K·√((ρL−ρG)/ρG). In a vertical vessel with a mist extractor the usual value is lower than in a horizontal one, because the whole gas load crosses the mesh head-on."],

 {t:["Tiempo de retención","Retention time"],

     "Time a liquid phase stays inside the equipment. In a vertical vessel it translates directly into height, not length: each phase occupies its own band of height over the same cross-section."],

 {t:["Deflector de entrada","Inlet deflector"],
  d:["Placa o dispositivo que recibe el chorro de alimentación y le quita cantidad de movimiento, para que el líquido no sea proyectado contra la pared ni arrastrado hacia la malla. Es un elemento delgado sin sobreespesor disponible y suele ser la primera pieza que se cambia.",
     "Plate or device that receives the feed jet and takes away its momentum, so that the liquid is neither thrown against the wall nor carried toward the mesh. It is a thin element with no corrosion allowance available and is usually the first part to be replaced."],

 {t:["Rompevórtices","Vortex breaker"],
  d:["Elemento sobre la salida de fondo que impide la formación del remolino que arrastraría gas o aceite hacia la línea de agua. Vive sumergido en la zona de menor velocidad del recipiente, que es la más agresiva.",
     "Element over the bottom outlet that prevents the vortex which would otherwise draw gas or oil into the water line. It lives submerged in the lowest-velocity zone of the vessel, which is the most aggressive one."],

{k:"gDes",items:[
 {t:["Tensión nominal de diseño f","Nominal design stress f"],
  d:["Tensión admisible del material a la temperatura de diseño. Para acero no austenítico en la situación normal de carga, es el menor valor entre el límite elástico a temperatura dividido por 1,5 y la resistencia a tracción a 20 °C dividida por 2,4.",

 {t:["Coeficiente de unión soldada z","Weld joint coefficient z"],

 {t:["Presión interna frente a cargas globales","Internal pressure versus global loads"],
  d:["Esta herramienta dimensiona el espesor solo por presión interna. En un vertical esbelto hay además una tensión longitudinal por peso propio y por el momento de viento y sismo, que puede gobernar el anillo inferior. Es la diferencia más importante frente a un horizontal sobre sillas.",
     "This tool sizes the thickness for internal pressure only. In a slender vertical vessel there is additionally a longitudinal stress from self-weight and from the wind and seismic moment, which can govern the bottom course. It is the most important difference from a horizontal vessel on saddles."],
  r:"EN 13445-3"},
 {t:["Sobreespesor por corrosión","Corrosion allowance"],
  d:["Espesor adicional que se consume durante la vida de diseño. Sale de la velocidad de corrosión de diseño multiplicada por los años, no de un valor de catálogo, y tiene un máximo práctico por encima del cual deja de ser la solución correcta.",
     "Additional thickness consumed over the design life. It comes from the design corrosion rate multiplied by the years, not from a catalogue value, and it has a practical maximum above which it stops being the right solution."],
  r:"ISO 21457 §8.2"},
 {t:["Disponibilidad de la mitigación","Mitigation availability"],
  d:["Fracción del tiempo en que el tratamiento químico está realmente operando. La velocidad de corrosión de diseño combina la tasa inhibida durante ese tiempo con la tasa desnuda durante el resto, y es esa combinación la que dimensiona el sobreespesor.",
     "Fraction of the time the chemical treatment is genuinely operating. The design corrosion rate combines the inhibited rate over that time with the bare rate over the remainder, and it is that combination which sizes the allowance."],
  r:"ISO 21457 §8.1"},
 {t:["Fondo toriesférico","Torispherical head"],
  d:["Fondo formado por un casquete esférico y un nudo de transición hacia la envolvente. Esta herramienta calcula solo la porción esférica; la norma exige además las verificaciones de pandeo plástico y de pandeo del nudo.",
     "Head formed by a spherical crown and a transition knuckle to the shell. This tool calculates only the spherical portion; the standard additionally requires the plastic buckling and knuckle buckling checks."],

{k:"gMat",items:[

 {t:["PREN","PREN"],
  d:["Número equivalente de resistencia a la picadura, calculado como %Cr + 3,3(%Mo + 0,5·%W) + 16·%N. Ordena las aleaciones por resistencia a la corrosión localizada, pero no sustituye al límite de temperatura de cada familia en el ambiente concreto.",

 {t:["Acero dúplex","Duplex stainless steel"],

 {t:["Revestimiento de la banda de interfaz","Interface band lining"],

 {t:["Certificado de inspección","Inspection document"],

    :`The slenderness comes out at ${f1(c.HD)}, above the maximum of ${S.ldMax}. The skirt and the wind and seismic loads grow, and this tool does not calculate them.`]);
  if(c.sour){

    :`The projected loss (${f1(c.loss,1)} mm) exceeds the allowed corrosion allowance (${S.caMax} mm). In this geometry the permanently wetted band is a narrow ring at a fixed position: lining only that band is preferable to thickening the whole shell.`]);

  const procRows=[

  const mechRows=[

    [t("mAdd"),f1(S.addT,1),"mm",""],
    [t("mNom"),c.eNom.toFixed(0),"mm",L==="es"?"Falta la tensión longitudinal por peso, viento y sismo":"The longitudinal stress from weight, wind and seismic is still missing"],
    [t("mHead"),c.eHead.toFixed(0),"mm",L==="es"?"Preliminar: faltan las verificaciones del nudo toriesférico":"Preliminary: the torispherical knuckle checks are still required"]];

  return `

function report(c){

  N.push(`   ${t("oil")}: ${S.qo} ${S.qoU==="m3d"?"m³/d":"bbl/d"}   ${t("water")}: ${S.qw} ${S.qwU==="m3d"?"m³/d":"bbl/d"}   ${t("gas")}: ${S.qg} ${S.qgU==="sm3d"?"Sm³/d":"MMscfd"}`);

  N.push(`   pCO₂ = ${f1(c.pco2,3)} bar   pH₂S = ${f1(c.ph2sk,2)} kPa   pH in situ = ${f1(S.ph,1)}`);
  N.push("   "+(c.sour?(L==="es"?`AMARGO — ${I18N.es.regLab[c.SSC.r]} de ISO 15156-2 Figura 1`:`SOUR — ISO 15156-2 Figure 1 ${I18N.en.regLab[c.SSC.r]}`)

  if(c.sour){const RR=REGREQ[c.SSC.r];
    N.push(`   ${L==="es"?"Ruta admitida":"Admitted route"}: ${RR.route}   ${L==="es"?"Dureza máx.":"Max hardness"}: ${RR.hrc} HRC / ${RR.hv} HV`);}
  N.push("");

  N.push("");
  N.push(L==="es"?"4. ALTURA — PRESUPUESTO POR TRAMOS":"4. HEIGHT — BUDGET BY SEGMENT");
  c.SEG.forEach(([k,v])=>N.push(`   ${t(k).padEnd(28," ")} ${f1(v).padStart(6," ")} m`));
  N.push(`   ${(L==="es"?"TOTAL entre tangentes":"TOTAL tangent-to-tangent").padEnd(28," ")} ${f1(c.H).padStart(6," ")} m   H/D = ${f1(c.HD)}`);
  N.push("");
  N.push(L==="es"?"5. DISEÑO MECÁNICO":"5. MECHANICAL DESIGN");
  N.push(`   ${c.shellMat.n} (${c.shellMat.std})   f = ${f1(c.f,1)} MPa`);
  N.push(`   ${t("mNom")}: ${c.eNom.toFixed(0)} mm   ${t("mHead")}: ${c.eHead.toFixed(0)} mm`);
  N.push("   "+(L==="es"?"Solo por presión interna. No incluye peso propio, viento ni sismo."
                        :"Internal pressure only. Self-weight, wind and seismic are not included."));
  N.push("");
  N.push(L==="es"?"6. SELECCIÓN POR ZONA":"6. SELECTION BY ZONE");
  Z.forEach(z=>{N.push(`   · ${z.z}: ${z.mat}`);N.push(`     ${z.b}`);});
  N.push("");
  N.push(L==="es"?"7. PENDIENTES":"7. OUTSTANDING ITEMS");
  (L==="es"?["Acordar el modelo de velocidad de corrosión con el usuario final",
    "Verificar los límites normativos contra la edición vigente",
    "Análisis estructural del faldón con cargas de viento y sismo (NSR-10)",
    "Completar las verificaciones del nudo toriesférico de los fondos",
    "Calificar los materiales en servicio amargo y definir los ensayos exigidos",
    "Definir el control de nivel e interfaz y la instrumentación",
    "Declarar las incertidumbres y los ensayos de calificación pendientes"]
   :["Agree the corrosion rate model with the end user",
    "Verify the normative limits against the current edition",
    "Structural analysis of the skirt with wind and seismic loads",
    "Complete the torispherical knuckle checks for the heads",
    "Qualify the materials in sour service and define the required testing",
    "Define the level and interface control and the instrumentation",
    "Declare the uncertainties and the pending qualification testing"]).forEach(x=>N.push("   - "+x));
  N.push("");
  N.push("Sergio Blanco, PhD — https://www.linkedin.com/in/sergio-blanco-professor/");
  return N.join("\n");
}

/* ============================================================ wiring */
const NUMK=["qo","qw","qg","pOp","tOp","pDes","tDes","rhoO","rhoW","mwG","zG","muO","muW","muG",
  "co2","h2s","cl","ph","sand","dmG","dmW","dmO","kSB","tO","tW","h1","hf","hdMin","hm","htMin",
  "ldMin","ldMax","zj","life","addT","caMax","vcor","vInh","avail"];
const SELK=["qoU","qwU","qgU","head","vmode","env"];
let TAB="sim";

function render(){
  document.getElementById("ttl").textContent=t("ttl");
  document.getElementById("sub").textContent=t("sub");
  document.getElementById("tab-sim").textContent=t("tabSim");
  document.getElementById("tab-ref").textContent=t("tabRef");
  document.getElementById("tab-sim").setAttribute("aria-pressed",String(TAB==="sim"));
  document.getElementById("tab-ref").setAttribute("aria-pressed",String(TAB==="ref"));
  const rl=document.getElementById("rail"), st=document.getElementById("strip"), c=compute();
  if(TAB==="sim"){
    document.getElementById("wrap").classList.remove("full");
    rl.hidden=false; st.hidden=false;
    rl.innerHTML=rail(); st.innerHTML=strip(c);
    document.getElementById("out").innerHTML=out(c);
    bind(c);
    const rp=document.getElementById("rep");
    if(rp&&!rp.textContent) rp.textContent=report(c);
  }else{
    document.getElementById("wrap").classList.add("full");
    rl.hidden=true; st.hidden=true; rl.innerHTML="";
    document.getElementById("out").innerHTML=refTab(c);
  }
}
function bind(c){
  NUMK.forEach(k=>{const el=document.getElementById(k); if(!el)return;
    el.addEventListener("input",()=>{const v=parseFloat(el.value); if(isFinite(v)){S[k]=v;SCEN="C";soft();}});});
  SELK.forEach(k=>{const el=document.getElementById(k); if(!el)return;
    el.addEventListener("change",()=>{S[k]=el.value; if(k==="vmode")render(); else {SCEN="C";soft();}});});
  const ins=document.getElementById("insul");
  if(ins) ins.addEventListener("change",()=>{S.insul=ins.checked;SCEN="C";soft();});
  document.querySelectorAll("[data-scen]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.scen; if(k!=="C"){S=Object.assign({},PRESETS[k]);SCEN=k;} else SCEN="C"; render();}));
  document.querySelectorAll("[data-lim]").forEach(i=>i.addEventListener("input",()=>{
    const v=parseFloat(i.value); if(isFinite(v)){LIM[i.dataset.lim].v=v;soft();}}));
  const vf=document.getElementById("v-fluid"), vm=document.getElementById("v-mat");
  if(vf) vf.addEventListener("click",()=>{VIEW="fluid";soft();});
  if(vm) vm.addEventListener("click",()=>{VIEW="mat";soft();});
  const g=document.getElementById("genrep");
  if(g) g.addEventListener("click",()=>{document.getElementById("rep").textContent=report(compute());});
  const cp=document.getElementById("cprep");
  if(cp) cp.addEventListener("click",async()=>{
    const el=document.getElementById("rep"); if(!el.textContent) el.textContent=report(compute());
    try{await navigator.clipboard.writeText(el.textContent); cp.textContent=t("copied");
      setTimeout(()=>cp.textContent=t("copy"),1600);}catch(e){
      const r=document.createRange(); r.selectNodeContents(el);
      const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);}});
}
function soft(){
  if(TAB!=="sim")return;
  const c=compute();
  document.getElementById("strip").innerHTML=strip(c);
  const rp=document.getElementById("rep"), keep=rp?rp.textContent:"";
  document.getElementById("out").innerHTML=out(c);
  const rp2=document.getElementById("rep");
  if(rp2) rp2.textContent=keep||report(c);
  document.querySelectorAll("[data-scen]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.scen===SCEN)));
  bind(c);
}
document.getElementById("tab-sim").addEventListener("click",()=>{TAB="sim";render();});
document.getElementById("tab-ref").addEventListener("click",()=>{TAB="ref";render();window.scrollTo(0,0);});
document.getElementById("lang-es").addEventListener("click",()=>{LANG="es";
  document.getElementById("lang-es").setAttribute("aria-pressed","true");
  document.getElementById("lang-en").setAttribute("aria-pressed","false");render();});
document.getElementById("lang-en").addEventListener("click",()=>{LANG="en";
  document.getElementById("lang-en").setAttribute("aria-pressed","true");
  document.getElementById("lang-es").setAttribute("aria-pressed","false");render();});
render();
</script>
